services:
  app:
    build:
      context: ./habit-api
      additional_contexts:
        web: ./habit-web
    env_file:
      - path: ./.env
        required: false
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      HABIT_WEB_ROOT: /app/wwwroot
      HABIT_QUOTA_PATH: /app/data/quota.log
    ports:
      - "127.0.0.1:${HABIT_PORT:-8080}:8080"
    volumes:
      - quota:/app/data
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >
          exec 3<>/dev/tcp/127.0.0.1/8080;
          printf 'GET /health HTTP/1.0\r\n\r\n' >&3;
          read -r status <&3;
          [[ $$status == *' 200 '* ]]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  quota:
