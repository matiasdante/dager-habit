name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: Compilación, pruebas y arranque
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Ejecutar pruebas unitarias
        run: npm test --prefix habit-web
      - name: Compilar la web y la API
        run: docker compose build
      - name: Levantar el contenedor
        run: docker compose up --no-build --wait --wait-timeout 90
      - name: Verificar la web y la API
        run: |
          curl -fsS http://localhost:8080/health | jq -e '.status == "ok"'
          curl -fsS http://localhost:8080/ | grep -F 'The Dager Habit'
          curl -fsS http://localhost:8080/manifest.webmanifest | jq -e '.name == "The Dager Habit"'
          curl -fsS http://localhost:8080/ngsw.json | jq -e '.configVersion > 0'
          curl -fsS http://localhost:8080/api/session | jq -e '.connected == false'
          curl -fsS http://localhost:8080/api/me | jq -e '.username == "local"'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Ejecutar pruebas de la API
        run: dotnet test habit-api.Tests
      - name: Preparar Chromium
        working-directory: habit-web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Probar los flujos de usuario en Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/habit-app"
          docker compose cp app:/app/. "$RUNNER_TEMP/habit-app"
          HABIT_TEST_API_DLL="$RUNNER_TEMP/habit-app/Habit.Api.dll" \
          HABIT_TEST_WEB_ROOT="$RUNNER_TEMP/habit-app/wwwroot" \
          npm run test:browser --prefix habit-web
      - name: Mostrar registros si falla
        if: failure()
        run: docker compose logs
      - name: Apagar el contenedor
        if: always()
        run: docker compose down --volumes

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Escanear el historial y los archivos versionados
        run: |
          image=ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          docker run --rm --volume "$PWD:/repo:ro" \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/repo \
            "$image" git --redact=100 --log-opts='--all --full-history' --max-decode-depth 3 /repo
          snapshot=$(mktemp -d)
          git archive HEAD | tar -x -C "$snapshot"
          docker run --rm --volume "$snapshot:/snapshot:ro" "$image" dir --redact=100 --max-decode-depth 3 /snapshot
